# ══════════════════════════════════════════════════════════════════════════════════════
#  DÉPLOIEMENT RENDER — SpyBusiness
# ══════════════════════════════════════════════════════════════════════════════════════
# Un seul service web. La base de données n'est PAS déclarée ici : elle est hébergée sur
# Supabase, dont l'offre gratuite n'expire pas — celle de Render supprime la base au bout de
# trente jours, ce qui tomberait pendant la période de soutenance.
#
# Ce qui vit ailleurs, et pourquoi :
#   base de données          Supabase (PostgreSQL + pgvector) — 310 Mo pour 500 Mo offerts
#   rédaction des analyses   Groq / Gemini, par appel d'API — aucun modèle local
#   vecteur de la question   Hugging Face Inference API — évite d'embarquer 1,9 Go de modèle
#
# Le pipeline d'extraction (PIPELINE/) n'est PAS déployé : ses dépendances — docling,
# paddleocr, torch-vision — pèsent plusieurs gigaoctets et ne servent qu'à transformer des PDF
# en lignes de base. L'ajout de données se fait donc depuis un poste local, pointé sur la même
# base. L'application le détecte seule et masque le bouton (cf. /api/features).

services:
  - type: web
    name: spybusiness
    runtime: python
    plan: free                    # 512 Mo de mémoire, 0,1 CPU
    region: frankfurt             # le plus proche d'Abidjan parmi les régions offertes
    branch: main
    # Passer le chemin de l'inventaire directement à pip ne marche PAS : il contient des
    # espaces, et pip le coupe au premier (essayé, il cherchait un fichier nommé « SGCI »).
    # build.py le résout en Python. Voir son en-tête.
    buildCommand: python build.py
    # DÉMARRAGE PAR wsgi:app, DEPUIS LA RACINE — pas par un `cd` vers le dossier de
    # l'application. Ce dossier s'appelle « SGCI Strategic Intelligence — Design System » :
    # des espaces et un tiret cadratin. Faire dépendre le démarrage de la façon dont
    # l'interpréteur de commandes de l'hébergeur traite ces octets, c'est parier sur un détail
    # qu'on ne maîtrise pas, pour un échec qui se produirait en production. wsgi.py localise le
    # dossier en Python, qui n'a pas ce problème (cf. son en-tête).
    #
    # Un seul worker : le plan gratuit n'a pas la mémoire pour deux, et les caches de
    # l'application sont EN MÉMOIRE — deux workers tiendraient deux caches divergents, dont
    # l'un servirait des chiffres différents de l'autre selon la requête. Les fils d'exécution
    # (threads) suffisent : les requêtes attendent surtout la base et les API, pas le CPU.
    #
    # timeout 180 : le préchauffage reconstruit les analyses au premier démarrage, et la
    # valeur par défaut (30 s) tuerait le worker en pleine tâche.
    startCommand: >
      gunicorn wsgi:app
      --bind 0.0.0.0:$PORT
      --workers 1
      --threads 8
      --timeout 180
      --graceful-timeout 30
      --access-logfile -
    # Sonde pointee sur /sante et non sur / : la page d accueil lit un fichier de 78 ko, ce
    # qui depasse les cinq secondes accordees quand un calcul lourd occupe les fils du worker
    # unique. L hebergeur concluait a une instance morte et la remplacait, interrompant
    # justement le calcul en cours. /sante ne touche ni disque, ni base, ni cache.
    healthCheckPath: /sante
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"

      # ── Base de données ────────────────────────────────────────────────────────────
      # Chaîne de connexion Supabase, à coller dans le tableau de bord Render.
      # Prendre le mode « Session pooler » (port 5432) : le mode transaction ne supporte pas
      # les curseurs nommés ni les instructions préparées dont psycopg2 se sert.
      - key: DATABASE_URL
        sync: false

      # ── Sécurité ──────────────────────────────────────────────────────────────────
      # Clé de signature des sessions. Render en tire une au hasard à la création, ce qui est
      # exactement ce qu'il faut : elle n'existe alors nulle part ailleurs, pas même ici.
      # ATTENTION : la changer déconnecte tout le monde — les cookies signés avec l'ancienne
      # clé deviennent invalides.
      - key: APP_SECRET_KEY
        generateValue: true

      # Rend le cookie de session « Secure » : le navigateur refuse alors de l'envoyer hors
      # HTTPS. Render sert exclusivement en HTTPS, donc la valeur est toujours vraie ici.
      - key: APP_HTTPS
        value: "1"

      # Origines autorisées à interroger l'API avec le cookie de session. À compléter avec
      # l'adresse réelle du service une fois connue (onglet Settings de Render).
      - key: APP_ORIGINES
        sync: false

      # Mot de passe du compte d'administration, créé au tout premier démarrage sur une base
      # vide. Sur une base déjà migrée, le compte existe et cette variable ne sert plus à rien :
      # le mot de passe est celui de la base. Elle reste utile pour un redéploiement à neuf.
      - key: APP_ADMIN_PASSWORD
        sync: false

      # ── Modèles de langage (appels d'API, aucun poids local) ───────────────────────
      # Gemini en tête, Groq en relais — et NON parce que Gemini serait plus généreux. Les
      # deux paliers gratuits ont été mesurés, et aucun ne tient une séance à lui seul :
      #   Groq    100 000 jetons par JOUR pour toutes les clés du compte, soit une quinzaine
      #           de questions au chat ;
      #   Gemini  20 REQUÊTES par jour et par modèle. C'est plus étroit encore.
      # Ils ne comptent simplement pas la même chose, donc ils s'épuisent à des moments
      # différents : le code bascule de l'un à l'autre en cours de question (chain.py,
      # _invoke_with_retry). Deux budgets valent mieux qu'un.
      #
      # Ce qui départage, c'est la FENÊTRE. Groq accepte 9 000 caractères de contexte, Gemini
      # 200 000. Tout un pan de complexité — réduire, partager la place entre les sections,
      # choisir ce que l'on sacrifie — n'existe que pour tenir dans 9 000. À 200 000, les
      # textes réglementaires arrivent ENTIERS au modèle, et les réponses citent l'article au
      # lieu de s'excuser.
      #
      # Pour une démonstration sans risque, il faut activer la facturation chez l'un des
      # deux : aucun réglage ne crée du quota qui n'existe pas.
      - key: LLM_PROVIDER
        value: gemini
      # Le nom du modèle se périme : « gemini-2.0-flash » a été retiré sans préavis utilisable
      # et l'appel rendait 404. Le garder ici permet d'en changer depuis le tableau de bord de
      # l'hébergeur, sans redéploiement de code.
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GROQ_API_KEY
        sync: false
      # UNE SEULE clé Groq était déclarée ici jusqu'au 2026-10-02 — alors que chain.py en
      # fait tourner DOUZE en local (_groq_key_index, rotation automatique sur quota épuisé,
      # cf. _invoke_with_retry). Sans les onze suivantes, une clé à sec sur Render n'a nulle
      # part où basculer~: le code attend 15 à 30 s par tentative (branche is_413/is_tpm) au
      # lieu de tourner sur une clé fraîche en quelques millisecondes. C'est la cause la plus
      # probable du chat « très rapide en local, très lent sur Render » — en local les douze
      # clés du .env absorbent la charge, sur Render une seule le pouvait.
      # À COLLER DANS LE TABLEAU DE BORD RENDER (Settings → Environment), PAS ICI~: les
      # valeurs réelles vivent dans BACK/.env (exclu de git), onze lignes GROQ_API_KEY_2 à
      # GROQ_API_KEY_12 à copier telles quelles.
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: GROQ_API_KEY_4
        sync: false
      - key: GROQ_API_KEY_5
        sync: false
      - key: GROQ_API_KEY_6
        sync: false
      - key: GROQ_API_KEY_7
        sync: false
      - key: GROQ_API_KEY_8
        sync: false
      - key: GROQ_API_KEY_9
        sync: false
      - key: GROQ_API_KEY_10
        sync: false
      - key: GROQ_API_KEY_11
        sync: false
      - key: GROQ_API_KEY_12
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # ── Claude (chat), via OpenRouter — demande du directeur du 2026-10-02 ─────────
      # Claude en tête du chat, Groq en secours automatique si Claude est à sec ou en panne
      # (chain.py::_ChatClaudePuisGroq). PAS la clé Anthropic native (ANTHROPIC_API_KEY,
      # restée à 0 crédit) — OpenRouter expose Claude à une adresse et dans un format
      # compatibles OpenAI, avec un budget séparé. CLAUDE_DISABLED=0 pour l'activer~; à 1,
      # le chat saute directement à Groq sans tenter Claude (coupe-circuit déjà utilisé par
      # server.py pour les analyses du tableau de bord).
      - key: CLAUDE_DISABLED
        value: "0"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: EF_CLAUDE_MODEL
        value: anthropic/claude-sonnet-5

      # ── Vectorisation de la question posée au chat ─────────────────────────────────
      # Jeton Hugging Face en lecture. Sans lui, le chat se désactive proprement et affiche un
      # message ; le reste de l'application n'en dépend pas.
      - key: HF_TOKEN
        sync: false
