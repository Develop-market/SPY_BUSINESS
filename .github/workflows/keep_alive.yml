name: Keep Render Alive (SpyBusiness)

on:
  schedule:
    # Exécution toutes les 10 minutes pour empêcher Render de s'endormir
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permet aussi de déclencher manuellement depuis l'onglet Actions de GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SpyBusiness Santé
        run: |
          curl -s -f -m 30 https://spybusiness.onrender.com/sante || echo "Ping failed or sleeping"
