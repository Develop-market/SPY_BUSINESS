<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SGCI Strategic Intelligence · UI Kit</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    html, body { background: var(--ink); min-height: 100vh; }
    body {
      background:
        radial-gradient(1200px 600px at 0% -10%, rgba(228,0,43,0.08), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(56,189,248,0.05), transparent 60%),
        linear-gradient(180deg, #060A14 0%, #04070E 100%);
      background-attachment: fixed;
    }
    .main {
      margin-left: 252px;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }
    .content {
      padding: 24px 30px 48px;
      max-width: 1480px;
      width: 100%;
      box-sizing: border-box;
    }
    .kit-eyebrow {
      font: 700 10px/1 var(--font-sans);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg-3);
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 currentColor; opacity: .8; }
      70%  { box-shadow: 0 0 0 6px transparent; opacity: 0; }
      100% { box-shadow: 0 0 0 0 transparent; opacity: 0; }
    }
    .typing-dot {
      width: 5px; height: 5px; border-radius: 999px; background: var(--fg-3);
      animation: typing 1.2s ease-in-out infinite;
      display: inline-block;
    }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: .4; }
      30% { transform: translateY(-3px); opacity: 1; }
    }
    button { font-family: inherit; }
    /* Focus ring */
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--sg-red-500);
      outline-offset: 1px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    const TITLES = {
      dashboard:      { title: "Tableau de bord", sub: "Lecture exécutive · Q2 2026" },
      positionnement: { title: "Positionnement Commercial", sub: "Tarifs & scénarios 2024 – 2026 · Côte d'Ivoire" },
      performance:    { title: "Performance Financière",   sub: "3 exercices (AN1 → AN3) · 7 banques" },
      synthese:       { title: "Synthèse Stratégique",     sub: "Lecture DG · Q2 2026" },
      assistant:      { title: "Assistant IA",             sub: "RAG · corpus banques ivoiriennes" },
      documents:      { title: "Documents",                sub: "Extraction multi-méthode · vector search" },
    };

    const App = () => {
      const [active, setActive] = useState("dashboard");

      const t = TITLES[active];

      return (
        <div data-screen-label={`Strategic Intel · ${t.title}`}>
          <Sidebar active={active} onChange={setActive} bankCount={7}/>
          <div className="main">
            <Topbar title={t.title} sub={t.sub} bankCount={7}/>
            <div className="content">
              {active === "dashboard"      && <DashboardScreen/>}
              {active === "positionnement" && <PositionnementScreen/>}
              {active === "performance"    && <PerformanceScreen/>}
              {active === "synthese"       && <SyntheseScreen/>}
              {active === "assistant"      && <AssistantScreen/>}
              {active === "documents"      && <DocumentsScreen/>}
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
